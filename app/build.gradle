plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kabilahtour.digitalbook'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kabilahtour.digitalbook'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
