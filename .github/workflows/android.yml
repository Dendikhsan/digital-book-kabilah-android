name: Build Digital Book Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Build Release AAB
        working-directory: app_project
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-upload-key.jks
            ./scripts/ci-build-release.sh --signed
          else
            ./scripts/ci-build-release.sh --unsigned
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: digital-book-kabilah-aab
          path: app_project/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping/report files (optional)
        uses: actions/upload-artifact@v4
        with:
          name: digital-book-kabilah-build-info
          path: |
            app_project/app/build/outputs/**/mapping/**
            app_project/app/build/outputs/**/reports/**
          if-no-files-found: ignore
