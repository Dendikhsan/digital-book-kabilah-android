name: Build Digital Book Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-upload-key.jks

          test -s release-upload-key.jks

          echo "Signing keystore prepared."

      - name: Build Release AAB
        run: |
          set -e

          gradle --no-daemon :app:bundleRelease

      - name: Sign Release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release-upload-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB" \
            "$ANDROID_KEY_ALIAS"

      - name: Verify Signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            -keystore release-upload-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: digital-book-kabilah-aab-final
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build Debug APK
        run: |
          set -e

          gradle --no-daemon :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: digital-book-kabilah-apk-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error