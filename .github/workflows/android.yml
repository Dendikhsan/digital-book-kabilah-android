name: Build Digital Book Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Build Release AAB
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ "$HAS_SIGNING" = "true" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-upload-key.jks

            cat > /tmp/digitalbook-signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getProperty("user.dir") + "/release-upload-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

            gradle --no-daemon -I /tmp/digitalbook-signing.gradle :app:bundleRelease
          else
            gradle --no-daemon :app:bundleRelease
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: digital-book-kabilah-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          
       - name: Build Debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: digital-book-kabilah-apk-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error